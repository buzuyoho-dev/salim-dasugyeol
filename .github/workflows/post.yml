name: threads-post
on:
  schedule:
    - cron: "30 3 * * *"   # 12:30 KST 질문글
    - cron: "30 10 * * *"  # 19:30 KST 다수결 정리글
    - cron: "30 13 * * *"  # 22:30 KST 둘 중 하나
  workflow_dispatch:
    inputs:
      dry_run: {description: "1이면 검사만", default: "1"}
permissions: {contents: write}
concurrency: {group: post, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 게시
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/publish.py
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "salim-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "게시 기록 $(TZ=Asia/Seoul date +%F_%H%M)" && git push)
