name: collect-replies
on:
  schedule:
    - cron: "50 14 * * *"  # 23:50 KST
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: post, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {THREADS_TOKEN: "${{ secrets.THREADS_TOKEN }}"}
        run: python scripts/collect_replies.py
      - run: |
          git config user.name "salim-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A . && (git diff --cached --quiet || (git commit -m "댓글 수집 $(TZ=Asia/Seoul date +%F)" && git push))
